# pnpm workspace — keeps web + mobile sharing one lockfile.
# When you `pnpm install` at the repo root, both apps' dependencies
# resolve together. The root package.json (Next.js web app) and
# mobile/package.json (Expo mobile app) are independent packages but
# the single lockfile means version drift between them stops being a
# class of bug.
packages:
  - "."
  - "mobile"

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
onlyBuiltDependencies:
  # Approved native build scripts. Drizzle-kit ships prebuilt binaries via
  # esbuild — running its install hook is safe and avoids a warning every
  # time someone runs pnpm install.
  - esbuild

# BuilderHQ iOS — XcodeGen project spec.
#
# Why XcodeGen instead of a committed .xcodeproj:
#   · .xcodeproj is a directory of binary plists. Diffing it in git is
#     painful — every "build settings tweak" creates a merge conflict.
#   · This file is the source of truth. Running `xcodegen generate`
#     produces the .xcodeproj from scratch, deterministically.
#   · Onboarding a new dev: `brew install xcodegen && xcodegen` —
#     they get the same project as everyone else.
#
# To bring up the project:
#   1. brew install xcodegen
#   2. cd ios-native && xcodegen generate
#   3. open BuilderHQ.xcodeproj

name: BuilderHQ
options:
  bundleIdPrefix: com.builderhq
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  developmentLanguage: en

settings:
  base:
    DEVELOPMENT_TEAM: "" # set in Xcode signing & capabilities per dev
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1" # iPhone only for v1 (Android via Compose later)
    SWIFT_STRICT_CONCURRENCY: minimal # bump to `complete` once codebase stabilises

targets:
  BuilderHQ:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BuilderHQ
    resources:
      - path: BuilderHQ/Resources
    info:
      path: BuilderHQ/Info.plist
      properties:
        CFBundleDisplayName: BuilderHQ
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIBackgroundModes:
          - remote-notification
        UIRequiresFullScreen: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: BuilderHQ uses the camera to scan and confirm your build address. Optional — only triggered when you tap "Scan address".
        NSLocationWhenInUseUsageDescription: BuilderHQ uses your location to show projects in your service area and suggest the closest matches.
        NSPhotoLibraryAddUsageDescription: BuilderHQ saves tender summaries and project documents to your Photos when you tap Share → Save Image.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.builderhq.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        ENABLE_HARDENED_RUNTIME: YES
        DEVELOPMENT_ASSET_PATHS: '"BuilderHQ/Preview Content"'
    entitlements:
      path: BuilderHQ/BuilderHQ.entitlements
      properties:
        aps-environment: development
